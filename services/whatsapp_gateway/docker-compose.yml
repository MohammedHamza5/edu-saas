version: '3.8'

services:
  whatsapp-gateway:
    build: .
    container_name: edusaas-whatsapp-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SESSION_ID=session_default
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-edusaas_secret_key_2026}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
