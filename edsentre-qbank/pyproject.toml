[project]
name = "edsentre-qbank"
version = "0.1.0"
description = "EdSentre Question Bank Reconstruction System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "sympy>=1.12",
    "pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

# تثبيت بميزة الذكاء الاصطناعي:
# pip install -e ".[ai]"
ai = [
    "google-generativeai>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "sympy", "fastapi", "fastapi.*", "google.generativeai", "google.generativeai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "core.pdf.adapter"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["services.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
