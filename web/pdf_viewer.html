<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Academic Secure PDF Reader</title>
  <style>
    :root {
      --bg-dark: #0B0F19;
      --surface-dark: #0F172A;
      --surface-elevated: #1E293B;
      --border-color: #334155;
      --primary: #5B4FE0;
      --primary-hover: #4F44C9;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --error-color: #EF4444;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Helvetica, Arial, sans-serif;
    }

    /* Print Protection */
    @media print {
      html, body {
        display: none !important;
        visibility: hidden !important;
      }
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-dark);
    }

    /* Fixed Top Toolbar (Always on top and fully clickable) */
    #toolbar {
      height: 52px;
      flex: 0 0 52px;
      background-color: var(--surface-dark);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      position: relative;
      z-index: 999;
      pointer-events: auto !important;
      gap: 10px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto !important;
    }

    .doc-info {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 260px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .doc-badge {
      background: rgba(91, 79, 224, 0.2);
      color: #A5B4FC;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(91, 79, 224, 0.4);
      letter-spacing: 0.5px;
    }

    .doc-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Action Buttons with Guaranteed Pointer Events */
    .btn {
      background: var(--surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      height: 34px;
      min-width: 34px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer !important;
      pointer-events: auto !important;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn:hover:not(:disabled) {
      background: #334155;
      border-color: #475569;
      color: #FFFFFF;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed !important;
    }

    .btn-icon {
      padding: 0;
      width: 34px;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      pointer-events: none;
    }

    /* Page Navigation Input */
    .page-nav {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .page-input {
      width: 44px;
      height: 32px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #FFFFFF;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      pointer-events: auto !important;
    }

    .page-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(91, 79, 224, 0.3);
    }

    .page-total {
      font-weight: 600;
      color: var(--text-main);
      min-width: 20px;
    }

    /* Zoom Level Display */
    .zoom-text {
      min-width: 46px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Viewer Container (Constrained Flexbox Child with Enabled Scroll) */
    #viewerContainer {
      flex: 1 1 0;
      min-height: 0 !important; /* CRITICAL: Enables scrolling in flex child */
      width: 100%;
      height: 100%;
      overflow-y: scroll !important;
      overflow-x: auto !important;
      position: relative;
      background-color: var(--bg-dark);
      padding: 24px 10px 48px 10px;
      direction: ltr; /* Keeps vertical scrollbar on standard right side */
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      pointer-events: auto !important;
      z-index: 10;
    }

    #pagesWrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100%;
      pointer-events: auto !important;
    }

    /* Page Canvas Card */
    .page-card {
      position: relative;
      background-color: #FFFFFF;
      margin: 0 auto 24px auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto !important;
    }

    .page-canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Watermark Overlays */
    .page-watermark-lattice {
      position: absolute;
      inset: 0;
      pointer-events: none !important;
      z-index: 10;
      overflow: hidden;
    }

    /* Floating Drifting Badge */
    #driftingBadge {
      position: absolute;
      z-index: 30;
      pointer-events: none !important;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      color: #FFFFFF;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: top 1.6s cubic-bezier(0.4, 0, 0.2, 1), left 1.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #driftingBadge svg {
      width: 13px;
      height: 13px;
      fill: #A5B4FC;
    }

    /* Loading and Error Modal (Positioned strictly below toolbar, never blocking toolbar) */
    #statusOverlay {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-dark);
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      pointer-events: auto;
    }

    #statusOverlay.hidden {
      display: none !important;
      pointer-events: none !important;
      visibility: hidden !important;
      z-index: -1 !important;
    }

    .main-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(91, 79, 224, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 14px;
      color: var(--text-main);
      font-weight: 600;
    }

    .status-subtext {
      font-size: 12px;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.5;
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      #toolbar {
        padding: 0 8px;
        gap: 4px;
      }
      .doc-info {
        display: none;
      }
      .btn {
        height: 30px;
        min-width: 30px;
        padding: 0 6px;
      }
      .btn-icon {
        width: 30px;
      }
      .page-input {
        width: 38px;
        height: 28px;
        font-size: 12px;
      }
      .zoom-text {
        min-width: 36px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sleek Academic Toolbar -->
    <header id="toolbar">
      <!-- Document Info / Title -->
      <div class="toolbar-group doc-info">
        <span class="doc-badge">PDF</span>
        <span class="doc-title" id="toolbarTitle">جاري تحميل المستند...</span>
      </div>

      <!-- Page Navigation (Previous / Page Input / Next) -->
      <div class="toolbar-group page-nav">
        <button id="btnPrev" class="btn btn-icon" title="الصفحة السابقة">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <input type="number" id="pageNumberInput" class="page-input" min="1" value="1">
        <span style="font-weight: 500;">/</span>
        <span id="pageTotalCount" class="page-total">--</span>
        <button id="btnNext" class="btn btn-icon" title="الصفحة التالية">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>

      <!-- Zoom Controls & Fit Width -->
      <div class="toolbar-group">
        <button id="btnZoomOut" class="btn btn-icon" title="تصغير">
          <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
        </button>
        <span id="zoomPercent" class="zoom-text">100%</span>
        <button id="btnZoomIn" class="btn btn-icon" title="تكبير">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
        <button id="btnFitWidth" class="btn" title="ملاءمة عرض الشاشة">العرض</button>
        <button id="btnRotate" class="btn btn-icon" title="تدوير 90 درجة">
          <svg viewBox="0 0 24 24"><path d="M7.11 8.53L5.7 7.11C4.8 8.27 4.24 9.61 4.07 11h2.02c.14-.87.55-1.72 1.02-2.47zM6.09 13H4.07c.17 1.39.72 2.73 1.62 3.89l1.41-1.42c-.52-.74-.9-1.59-1.01-2.47zm1.01 5.32c1.16.9 2.51 1.44 3.9 1.61V17.9c-.87-.15-1.71-.53-2.48-1.03l-1.42 1.45zM13 4.07V1L8.45 5.55 13 10V6.09c3.29.54 5.86 3.32 5.99 6.7.13 3.66-2.73 6.77-6.4 6.94-1.28.06-2.52-.3-3.6-1l-1.44 1.44C9.07 21.2 10.99 21.8 13 21.73c4.95-.23 8.91-4.38 8.73-9.33C21.57 7.69 17.75 3.96 13 4.07z"/></svg>
        </button>
        <button id="btnFullscreen" class="btn btn-icon" title="ملء الشاشة">
          <svg id="fullscreenIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <button id="btnOpenExternal" class="btn btn-icon" title="فتح في نافذة مستقلة (سريع جداً للآيباد)" style="color:#A5B4FC;">
          <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        </button>
      </div>

      <!-- Native Close Button in PDF Toolbar (Always Accessible) -->
      <div class="toolbar-group">
        <button id="btnCloseModal" class="btn" style="background:#EF4444; color:#FFFFFF; font-weight:700; border:none; border-radius:6px; padding:0 12px; gap:6px; display:inline-flex; align-items:center; cursor:pointer;" title="إغلاق المستند (Esc)">
          <span>إغلاق</span>
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Viewport for Pages -->
    <main id="viewerContainer">
      <div id="pagesWrapper">
        <!-- Dynamically generated page containers with canvas -->
      </div>
    </main>

    <!-- Dynamic Forensic Drifting Badge -->
    <div id="driftingBadge" style="display: none;">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
      <span id="badgeText">منصة مؤمنة أكاديمياً</span>
    </div>

    <!-- Status Overlay (Loading / Error) -->
    <div id="statusOverlay">
      <div class="main-spinner" id="statusSpinner"></div>
      <div class="status-text" id="statusText">جاري تهيئة العارض الآمن...</div>
      <div class="status-subtext" id="statusSubtext">يتم إعداد صفحات المستند بدقة عالية لمنع التنزيل وحماية المحتوى.</div>
      <button id="btnRetry" class="btn btn-primary" style="display: none; margin-top: 10px;">إعادة المحاولة</button>
    </div>
  </div>

  <!-- Local PDF.js Core Library -->
  <script src="pdf.min.js"></script>
  <script>
    // Configure Local Worker
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
    }

    (function() {
      'use strict';

      // ── Anti-Theft & Security Hardening ──
      // 1. Disable Right Click Context Menu
      window.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      }, { capture: true });

      // 2. Disable Keyboard Shortcuts (Ctrl+S, Ctrl+P, Ctrl+C, Ctrl+U, F12, Ctrl+Shift+I)
      window.addEventListener('keydown', function(e) {
        var key = (e.key || '').toLowerCase();
        var ctrl = e.ctrlKey || e.metaKey;

        if (ctrl && (key === 's' || key === 'p' || key === 'c' || key === 'u' || key === 'a')) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        if (key === 'f12' || (ctrl && e.shiftKey && (key === 'i' || key === 'j' || key === 'c'))) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        // Navigation shortcuts
        if (key === 'arrowdown' || key === 'pagedown') {
          viewerContainer.scrollBy({ top: 260, behavior: 'smooth' });
        } else if (key === 'arrowup' || key === 'pageup') {
          viewerContainer.scrollBy({ top: -260, behavior: 'smooth' });
        }
      }, { capture: true });

      // 3. Disable Dragging
      window.addEventListener('dragstart', function(e) {
        e.preventDefault();
        return false;
      });

      // ── DOM References ──
      var viewerContainer = document.getElementById('viewerContainer');
      var pagesWrapper = document.getElementById('pagesWrapper');
      var toolbarTitle = document.getElementById('toolbarTitle');
      var pageNumberInput = document.getElementById('pageNumberInput');
      var pageTotalCount = document.getElementById('pageTotalCount');
      var zoomPercent = document.getElementById('zoomPercent');
      var btnPrev = document.getElementById('btnPrev');
      var btnNext = document.getElementById('btnNext');
      var btnZoomIn = document.getElementById('btnZoomIn');
      var btnZoomOut = document.getElementById('btnZoomOut');
      var btnFitWidth = document.getElementById('btnFitWidth');
      var btnRotate = document.getElementById('btnRotate');
      var btnFullscreen = document.getElementById('btnFullscreen');
      var btnOpenExternal = document.getElementById('btnOpenExternal');
      var statusOverlay = document.getElementById('statusOverlay');
      var statusSpinner = document.getElementById('statusSpinner');
      var statusText = document.getElementById('statusText');
      var statusSubtext = document.getElementById('statusSubtext');
      var btnRetry = document.getElementById('btnRetry');
      var driftingBadge = document.getElementById('driftingBadge');
      var badgeText = document.getElementById('badgeText');

      // ── State Variables ──
      var currentPdfDoc = null;
      var isDocLoading = false;
      var totalPages = 0;
      var currentPage = 1;
      var currentScale = 1.0;
      var isFitWidth = true;
      var currentRotation = 0;
      var watermarkString = '';
      var documentTitle = '';
      var activePdfUrl = '';
      var pageContainers = [];
      var pageRenderQueue = new Map();
      var pageViewports = new Map();

      // Drifting Badge Positions (9 points grid)
      var badgeGrid = [
        { top: '15%', left: '10%' },
        { top: '15%', left: '45%' },
        { top: '15%', left: '75%' },
        { top: '48%', left: '10%' },
        { top: '48%', left: '45%' },
        { top: '48%', left: '75%' },
        { top: '80%', left: '10%' },
        { top: '80%', left: '45%' },
        { top: '80%', left: '75%' }
      ];
      var badgeIndex = 4;
      var badgeTimer = null;

      function startDriftingBadge(text) {
        if (!text) return;
        watermarkString = text;
        badgeText.textContent = text;
        driftingBadge.style.display = 'flex';
        updateBadgePosition();

        if (badgeTimer) clearInterval(badgeTimer);
        badgeTimer = setInterval(function() {
          var nextIdx = Math.floor(Math.random() * badgeGrid.length);
          if (nextIdx === badgeIndex) {
            nextIdx = (nextIdx + 1) % badgeGrid.length;
          }
          badgeIndex = nextIdx;
          updateBadgePosition();
        }, 8000);
      }

      function updateBadgePosition() {
        var pos = badgeGrid[badgeIndex];
        driftingBadge.style.top = pos.top;
        driftingBadge.style.left = pos.left;
      }

      // ── Generate Repeating Watermark Canvas ──
      function createWatermarkPattern(text) {
        var patternCanvas = document.createElement('canvas');
        var pctx = patternCanvas.getContext('2d');
        var fontSize = 13;
        patternCanvas.width = 340;
        patternCanvas.height = 200;

        pctx.clearRect(0, 0, patternCanvas.width, patternCanvas.height);
        pctx.save();
        pctx.translate(170, 100);
        pctx.rotate(-22 * Math.PI / 180);
        pctx.font = '600 ' + fontSize + 'px sans-serif';
        pctx.fillStyle = 'rgba(15, 23, 42, 0.10)';
        pctx.textAlign = 'center';
        pctx.fillText(text, 0, 0);
        pctx.restore();

        return patternCanvas.toDataURL('image/png');
      }

      // ── Main Document Loader ──
      async function loadPdfDocument(url, watermark, title) {
        if (!url) return;
        // Avoid duplicate concurrent or identical re-fetches
        if (activePdfUrl === url && (currentPdfDoc || isDocLoading)) {
          return;
        }

        activePdfUrl = url;
        isDocLoading = true;
        watermarkString = watermark || watermarkString;
        documentTitle = title || documentTitle || 'مستند تعليمي';

        toolbarTitle.textContent = documentTitle;
        if (watermarkString) {
          startDriftingBadge(watermarkString);
        }

        // Show loading status
        statusOverlay.classList.remove('hidden');
        statusSpinner.style.display = 'block';
        btnRetry.style.display = 'none';
        statusText.textContent = 'جاري جلب صفحات المستند...';
        statusSubtext.textContent = 'يتم تحضير المحتوى بدقة أكاديمية عالية داخل المنصة.';

        try {
          if (!window.pdfjsLib) {
            throw new Error('مكتبة PDF.js غير متوفرة محلياً.');
          }

          statusText.textContent = 'جاري تحضير الصفحات بسرعة فائقة...';
          var loadingTask = pdfjsLib.getDocument({
            url: url,
            withCredentials: false,
            enableXfa: false,
            rangeChunkSize: 65536,
            disableAutoFetch: true,
            disableStream: false
          });

          loadingTask.onProgress = function(progress) {
            if (progress && progress.total > 0) {
              var percent = Math.min(Math.round((progress.loaded / progress.total) * 100), 99);
              statusText.textContent = 'جاري التحميل... ' + percent + '%';
            }
          };

          currentPdfDoc = await loadingTask.promise;
          totalPages = currentPdfDoc.numPages;
          pageTotalCount.textContent = totalPages;
          pageNumberInput.max = totalPages;

          // Hide status overlay cleanly
          statusOverlay.classList.add('hidden');
          isDocLoading = false;

          // Initialize Pages
          await initPageContainers();
        } catch (err) {
          console.error('[SecurePdfViewer] Error loading document:', err);
          isDocLoading = false;
          statusSpinner.style.display = 'none';
          btnRetry.style.display = 'inline-flex';
          statusText.textContent = 'تعذر فتح المستند';
          statusSubtext.textContent = 'قد يكون الرابط المؤقت قد انتهت صلاحيته أو حدث انقطاع في الاتصال. يرجى إعادة المحاولة.';
        }
      }

      // ── Page Containers Setup ──
      async function initPageContainers() {
        pagesWrapper.innerHTML = '';
        pageContainers = [];
        pageRenderQueue.clear();
        pageViewports.clear();

        // Get Page 1 to compute initial aspect ratio and scale
        var firstPage = await currentPdfDoc.getPage(1);
        var baseViewport = firstPage.getViewport({ scale: 1.0, rotation: currentRotation });
        pageViewports.set(1, baseViewport);

        // Compute fit-width scale
        computeScale(baseViewport);

        var watermarkPatternUrl = watermarkString ? createWatermarkPattern(watermarkString) : null;

        // Create container elements for all pages
        for (var p = 1; p <= totalPages; p++) {
          var container = document.createElement('div');
          container.className = 'page-card';
          container.id = 'page-card-' + p;
          container.setAttribute('data-page', p);

          var pWidth = Math.floor(baseViewport.width * currentScale);
          var pHeight = Math.floor(baseViewport.height * currentScale);
          container.style.width = pWidth + 'px';
          container.style.height = pHeight + 'px';

          // Canvas element
          var canvas = document.createElement('canvas');
          canvas.className = 'page-canvas';
          canvas.id = 'canvas-' + p;
          container.appendChild(canvas);

          // Watermark Lattice Overlay
          if (watermarkPatternUrl) {
            var watermarkLayer = document.createElement('div');
            watermarkLayer.className = 'page-watermark-lattice';
            watermarkLayer.style.backgroundImage = 'url(' + watermarkPatternUrl + ')';
            watermarkLayer.style.backgroundRepeat = 'repeat';
            container.appendChild(watermarkLayer);
          }

          pagesWrapper.appendChild(container);
          pageContainers.push(container);
        }

        updateControlsState();

        // Render first 2 pages immediately!
        renderPage(1);
        if (totalPages >= 2) {
          renderPage(2);
        }

        // Attach viewport visibility scanner
        checkVisiblePages();
      }

      function computeScale(baseViewport) {
        if (!baseViewport) {
          baseViewport = pageViewports.get(1);
        }
        if (!baseViewport) return;

        if (isFitWidth) {
          var containerWidth = viewerContainer.clientWidth - 40;
          if (containerWidth < 300) containerWidth = 300;
          currentScale = containerWidth / baseViewport.width;
        }
        zoomPercent.textContent = Math.round(currentScale * 100) + '%';
      }

      // ── Viewport Visibility Scanner ──
      var scrollTimeout = null;
      function onScrollHandler() {
        checkVisiblePages();
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(updateActivePageIndicator, 80);
      }

      viewerContainer.addEventListener('scroll', onScrollHandler, { passive: true });

      function checkVisiblePages() {
        if (!currentPdfDoc || pageContainers.length === 0) return;

        var scrollTop = viewerContainer.scrollTop;
        var containerHeight = viewerContainer.clientHeight;
        var buffer = 900; // 900px buffer above and below viewport
        var farThreshold = 2500; // Unload canvas texture beyond 2500px to keep iPad Safari VRAM low

        for (var i = 0; i < pageContainers.length; i++) {
          var container = pageContainers[i];
          var pageNum = i + 1;
          var top = container.offsetTop;
          var height = container.offsetHeight;
          var bottom = top + height;

          if (bottom >= (scrollTop - buffer) && top <= (scrollTop + containerHeight + buffer)) {
            renderPage(pageNum);
          } else if (bottom < (scrollTop - farThreshold) || top > (scrollTop + containerHeight + farThreshold)) {
            unloadPageCanvas(pageNum);
          }
        }
      }

      function unloadPageCanvas(pageNum) {
        var queueItem = pageRenderQueue.get(pageNum);
        if (queueItem) {
          if (queueItem.renderTask) {
            try { queueItem.renderTask.cancel(); } catch(e) {}
          }
          pageRenderQueue.delete(pageNum);
        }
        var canvas = document.getElementById('canvas-' + pageNum);
        if (canvas && (canvas.width > 1 || canvas.height > 1)) {
          canvas.width = 1;
          canvas.height = 1;
        }
      }

      function updateActivePageIndicator() {
        if (pageContainers.length === 0) return;
        var scrollTop = viewerContainer.scrollTop + 140;
        var activePage = 1;

        for (var i = 0; i < pageContainers.length; i++) {
          var container = pageContainers[i];
          if (container.offsetTop <= scrollTop) {
            activePage = i + 1;
          } else {
            break;
          }
        }

        if (activePage !== currentPage) {
          currentPage = activePage;
          pageNumberInput.value = currentPage;
          updateControlsState();
        }
      }

      // ── Render Individual Page with High-DPI ──
      async function renderPage(pageNum) {
        var queueItem = pageRenderQueue.get(pageNum);
        if (queueItem && queueItem.renderedScale === currentScale && queueItem.renderedRotation === currentRotation) {
          return; // Already rendered at target scale
        }

        if (queueItem && queueItem.renderTask) {
          try {
            queueItem.renderTask.cancel();
          } catch(e) {}
        }

        try {
          var page = await currentPdfDoc.getPage(pageNum);
          var unscaledViewport = page.getViewport({ scale: 1.0, rotation: currentRotation });
          pageViewports.set(pageNum, unscaledViewport);

          var container = document.getElementById('page-card-' + pageNum);
          var canvas = document.getElementById('canvas-' + pageNum);

          if (!container || !canvas) return;

          // Base unscaled dimensions in CSS pixels
          var baseViewport = page.getViewport({ scale: currentScale, rotation: currentRotation });
          container.style.width = Math.floor(baseViewport.width) + 'px';
          container.style.height = Math.floor(baseViewport.height) + 'px';

          // High-DPI crisp buffer
          var dpr = window.devicePixelRatio || 1;
          if (dpr > 2.0) dpr = 2.0;

          var scaledViewport = page.getViewport({ scale: currentScale * dpr, rotation: currentRotation });

          canvas.width = Math.floor(scaledViewport.width);
          canvas.height = Math.floor(scaledViewport.height);
          canvas.style.width = Math.floor(baseViewport.width) + 'px';
          canvas.style.height = Math.floor(baseViewport.height) + 'px';

          var renderContext = {
            canvasContext: canvas.getContext('2d'),
            viewport: scaledViewport
          };

          var renderTask = page.render(renderContext);
          pageRenderQueue.set(pageNum, {
            renderTask: renderTask,
            renderedScale: currentScale,
            renderedRotation: currentRotation
          });

          await renderTask.promise;
        } catch (err) {
          if (err && err.name === 'RenderingCancelledException') {
            return;
          }
          console.warn('[SecurePdfViewer] Error rendering page ' + pageNum + ':', err);
        }
      }

      // ── Zoom and Resize Handlers ──
      var resizeDebounce = null;
      window.addEventListener('resize', function() {
        if (!currentPdfDoc) return;
        if (isFitWidth) {
          clearTimeout(resizeDebounce);
          resizeDebounce = setTimeout(function() {
            computeScale();
            applyZoomChange();
          }, 150);
        }
      });

      function applyZoomChange() {
        var baseViewport = pageViewports.get(1);
        if (!baseViewport) return;

        var targetWidth = Math.floor(baseViewport.width * currentScale);
        var targetHeight = Math.floor(baseViewport.height * currentScale);

        pageContainers.forEach(function(container) {
          container.style.width = targetWidth + 'px';
          container.style.height = targetHeight + 'px';
        });

        zoomPercent.textContent = Math.round(currentScale * 100) + '%';
        pageRenderQueue.clear();

        // Re-render currently visible pages immediately
        checkVisiblePages();
      }

      function zoomIn() {
        isFitWidth = false;
        currentScale = Math.min(currentScale * 1.2, 3.0);
        applyZoomChange();
      }

      function zoomOut() {
        isFitWidth = false;
        currentScale = Math.max(currentScale / 1.2, 0.45);
        applyZoomChange();
      }

      function fitWidth() {
        isFitWidth = true;
        computeScale();
        applyZoomChange();
      }

      function rotate() {
        currentRotation = (currentRotation + 90) % 360;
        applyZoomChange();
      }

      // ── Navigation Functions ──
      function scrollToPage(pageNum) {
        if (pageNum < 1) pageNum = 1;
        if (pageNum > totalPages) pageNum = totalPages;
        currentPage = pageNum;
        pageNumberInput.value = currentPage;

        var targetCard = document.getElementById('page-card-' + pageNum);
        if (targetCard) {
          targetCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        updateControlsState();
      }

      function updateControlsState() {
        btnPrev.disabled = (currentPage <= 1);
        btnNext.disabled = (currentPage >= totalPages);
      }

      // ── Event Listeners with Guaranteed Invocation ──
      btnPrev.onclick = function(e) {
        e.preventDefault();
        scrollToPage(currentPage - 1);
      };

      btnNext.onclick = function(e) {
        e.preventDefault();
        scrollToPage(currentPage + 1);
      };

      btnZoomIn.onclick = function(e) {
        e.preventDefault();
        zoomIn();
      };

      btnZoomOut.onclick = function(e) {
        e.preventDefault();
        zoomOut();
      };

      btnFitWidth.onclick = function(e) {
        e.preventDefault();
        fitWidth();
      };

      btnRotate.onclick = function(e) {
        e.preventDefault();
        rotate();
      };

      pageNumberInput.onchange = function() {
        var num = parseInt(pageNumberInput.value, 10);
        if (!isNaN(num)) {
          scrollToPage(num);
        }
      };

      btnRetry.onclick = function(e) {
        e.preventDefault();
        if (activePdfUrl) {
          loadPdfDocument(activePdfUrl, watermarkString, documentTitle);
        }
      };

      // Fullscreen Toggle
      btnFullscreen.onclick = function(e) {
        e.preventDefault();
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function(err) {
            console.warn('Fullscreen request failed:', err);
          });
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      };

      if (btnOpenExternal) {
        btnOpenExternal.onclick = function(e) {
          e.preventDefault();
          if (activePdfUrl) {
            window.open(activePdfUrl, '_blank');
          }
        };
      }

      document.addEventListener('fullscreenchange', function() {
        var isFs = !!document.fullscreenElement;
        var icon = document.getElementById('fullscreenIcon');
        if (isFs) {
          icon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
        } else {
          icon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        }
        setTimeout(function() {
          if (isFitWidth) {
            computeScale();
            applyZoomChange();
          }
        }, 150);
      });

      // ── PostMessage Communication with Flutter Parent ──
      window.addEventListener('message', function(event) {
        if (!event.data) return;
        var data = event.data;
        if (data.type === 'LOAD_PDF') {
          loadPdfDocument(data.url, data.watermark, data.title);
        }
      });

      // Check URL query parameters as fallback
      var urlParams = new URLSearchParams(window.location.search);
      var queryPdfUrl = urlParams.get('url') || urlParams.get('file');
      var queryWatermark = urlParams.get('watermark');
      var queryTitle = urlParams.get('title');

      if (queryPdfUrl) {
        loadPdfDocument(queryPdfUrl, queryWatermark, queryTitle);
      }

      // Signal to parent window that PDF viewer is ready
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'PDF_VIEWER_READY' }, '*');
        }
      } catch(e) {}

      // Close Button & Escape Key Listeners
      function triggerClose() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'CLOSE_PDF_SHEET' }, '*');
          }
        } catch(e) {}
      }

      var btnCloseModal = document.getElementById('btnCloseModal');
      if (btnCloseModal) {
        btnCloseModal.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          triggerClose();
        };
      }

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.keyCode === 27) {
          triggerClose();
        }
      });

    })();
  </script>
</body>
</html>
